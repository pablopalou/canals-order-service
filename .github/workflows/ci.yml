name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
          POSTGRES_DB: orders
        ports:
          - 5433:5432
        # The suite connects as soon as the job starts, so the job must not
        # begin until Postgres is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://orders:orders@localhost:5433/orders

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the engines field: the service runs TypeScript directly.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Development tooling pulls in advisories that never reach the running
      # service, so the gate is what actually ships.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -t order-service:ci .
