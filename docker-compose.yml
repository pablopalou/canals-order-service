services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      # Published on 5433 so it cannot collide with a Postgres already running
      # on the reviewer's machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    # Node runs as PID 1 here, where it is not expected to reap children or
    # forward signals. Docker's init does both.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
      PAYMENTS_LATENCY_MS: "120"
    ports:
      - "3000:3000"
    # Migrations run on start; the seed only populates an empty catalogue, so
    # restarting the stack does not wipe orders placed against the last run.
    command: >
      sh -c "node dist/db/migrate.js
      && node dist/db/seed.js --if-empty
      && node dist/server.js"
    healthcheck:
      # Readiness, not liveness: the container is only healthy once it can
      # actually reach the database.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      # Generous while starting, quick to notice afterwards: ten retries meant
      # nearly a minute of being reported healthy while unable to serve.
      start_period: 30s
      retries: 3

volumes:
  pgdata:
